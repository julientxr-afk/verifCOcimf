@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1511; --card:#15201A; --ink:#E8F1EB; --muted:#9AAEA1; --line:#2B3B31;
    --course:#D42A8F; --course-text:#FF86C6; --on-course:#FFFFFF;
    --ok:#5AD394; --ok-bg:#12301F; --bad:#FF7B84; --bad-bg:#3A1519;
    --lv-easy:#3FB56C; --lv-mid:#F5CE2E; --lv-hard:#F0525A; --track:#4B5C51;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1511; --card:#15201A; --ink:#E8F1EB; --muted:#9AAEA1; --line:#2B3B31;
  --course:#D42A8F; --course-text:#FF86C6; --on-course:#FFFFFF;
  --ok:#5AD394; --ok-bg:#12301F; --bad:#FF7B84; --bad-bg:#3A1519;
  --lv-easy:#3FB56C; --lv-mid:#F5CE2E; --lv-hard:#F0525A; --track:#4B5C51;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:17px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--topo) center/cover no-repeat;opacity:.16;pointer-events:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(30px,7vw,42px);font-weight:800}
h2{font-size:22px;font-weight:700}
h1[tabindex="-1"]:focus{outline:none}
p{margin:0}
:focus-visible{outline:3px solid var(--course);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:8px 16px 40px}
.wrap.wide{max-width:1040px}
.muted{color:var(--muted)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-in.wide-h{max-width:1040px}
.top-r{display:flex;align-items:center;gap:14px;flex:none;margin-left:auto}
.logo{display:block;height:38px;width:auto}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px;flex:none}
.ghost{background:none;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px;min-height:44px}
.ghost:hover{border-color:var(--course)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-family:var(--font-display);font-weight:700;font-size:18px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--course)}
.btn.primary{background:var(--course);border-color:var(--course);color:var(--on-course)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:44px;padding:8px 14px;font-size:16px}
.btn.block{display:flex;width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* Champs */
.field{display:block}
.field>span{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--course)}

/* Accueil */
.hero{padding:22px 0 14px}
.hero p{margin-top:8px;color:var(--muted);max-width:52ch}
.notice{margin:12px 0;padding:10px 14px;border-radius:12px;border:1.5px dashed var(--control);background:var(--card);font-size:15px}
.who{display:grid;gap:12px;margin:8px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lvl{margin:0 0 22px}
.lvl h2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lvl h2 small{font-family:var(--font-body);font-weight:500;font-size:14px;color:var(--muted)}
.lv-facile{--lv:var(--lv-easy)}.lv-intermediaire{--lv:var(--lv-mid)}.lv-difficile{--lv:var(--lv-hard)}
.dot{display:inline-block;flex:none;width:14px;height:14px;border-radius:50%;background:var(--lv,var(--muted));box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.28)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;min-height:86px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left}
.tile b{font-family:var(--font-display);font-size:32px;line-height:1;font-weight:800}
.tile span{font-size:13px;color:var(--muted)}
.tile{box-shadow:inset 0 7px 0 var(--lv)}
.tile{padding-top:18px}
.tile:hover{border-color:var(--lv)}
.tile.rev{border-style:dashed}
.hist{margin-top:26px}
.hist ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.hist button{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left}
.hist button b{font-family:var(--font-display)}

/* Parcours */
.back{background:none;border:0;padding:12px 4px;cursor:pointer;font-weight:600;color:var(--muted);min-height:44px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px}
.course-card{margin-bottom:14px}
.cc-head h1{font-size:34px}
.cc-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;font-weight:600}
.len{font-weight:600;color:var(--muted)}
.course{width:100%;height:auto;display:block}
.course .path{stroke:var(--course);stroke-width:4;stroke-linecap:round}
.course .ring{fill:var(--card);stroke:var(--course);stroke-width:5}
.course .ring.ok{stroke:var(--ok);fill:var(--ok-bg)}
.course .ring.bad{stroke:var(--bad);fill:var(--bad-bg)}
.course .tri{fill:none;stroke:var(--course);stroke-width:5;stroke-linejoin:round}
.course text{font-family:var(--font-display);font-weight:800;font-size:26px;fill:var(--ink);text-anchor:middle}
.course .bdg.ok{fill:var(--ok)}.course .bdg.bad{fill:var(--bad)}
.course .sym{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.course.anim .node{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i)*140ms)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}

.step{margin-bottom:14px}
.step h2{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.step .n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--course);color:var(--on-course);font-size:17px}
.step>p{color:var(--muted);margin-bottom:12px}
.refgrid{display:grid;grid-template-columns:30px repeat(4,1fr);gap:6px;max-width:420px}
.refgrid .ax{display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--muted)}
.rc{min-height:58px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;font-size:14px;color:var(--muted);font-weight:600}
.rc:hover{border-color:var(--course)}
.rc[aria-pressed=true]{background:var(--course);border-color:var(--course);color:var(--on-course);font-family:var(--font-display);font-weight:800;font-size:20px}
.ref-out{margin-top:12px;min-height:26px;font-weight:500}
.ref-out b{font-family:var(--font-display);font-size:20px;color:var(--course-text)}
.lrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lcell{display:flex;flex-direction:column;align-items:center;gap:8px}
.lcell label{font-weight:600;font-size:14px;line-height:1.2;text-align:center;color:var(--muted)}
.ord{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--course);color:var(--course-text);font-size:14px;font-family:var(--font-display);font-weight:800}
input.letter{width:100%;max-width:96px;min-height:64px;padding:0;text-align:center;text-transform:uppercase;font-family:var(--font-display);font-weight:800;font-size:36px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.time{display:flex;align-items:flex-end;gap:10px}
.time label span{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.time input{width:104px;min-height:64px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:32px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.time .colon{font-family:var(--font-display);font-weight:800;font-size:32px;padding-bottom:12px}
.pace{margin-top:12px;min-height:24px;color:var(--muted);font-weight:500}
.bar{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 72%,transparent)}

/* Résultat */
.res-head{padding:14px 0 8px}
.res-head p{margin-top:6px;color:var(--muted)}
.res-head.perfect h1{color:var(--ok)}
.res-head.wrong h1{color:var(--bad)}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;align-items:center;gap:12px;padding:12px 0}
.checks li+li{border-top:1px solid var(--line)}
.checks .ic{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff}
.checks .ok .ic{background:var(--ok)}.checks .bad .ic{background:var(--bad)}
.checks .ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.checks .lt{margin-left:auto;font-family:var(--font-display);font-weight:800;font-size:24px}
.checks .bad .lt{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:clamp(22px,6vw,32px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.err{display:inline-block;min-width:26px;padding:1px 9px;border-radius:999px;font-weight:700;font-size:14px;text-align:center}
.err.e0{background:var(--ok-bg);color:var(--ok)}
.err.e1{background:#FFE9D2;color:#8A3D00}
.err.e2{background:var(--bad-bg);color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err.e1{background:#3D2A12;color:#FFB877}}
:root[data-theme="dark"] .err.e1{background:#3D2A12;color:#FFB877}

/* Espace enseignant */
.gate{max-width:420px;margin:30px auto;display:grid;gap:12px}
.err-txt{color:var(--bad);min-height:22px;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.tbar .sum{flex:1;min-width:200px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:13px;color:var(--muted);font-weight:600}
th button{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:inherit}
td.num{font-variant-numeric:tabular-nums}
td .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:6px 10px;min-height:36px}
.two{display:grid;gap:14px}
@media (min-width:820px){.two{grid-template-columns:1fr 1fr}}
.help{font-size:14px;color:var(--muted);margin:6px 0 10px}
.msg{margin:10px 0;padding:10px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);white-space:pre-line}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.msg.good{border-color:var(--ok);color:var(--ok)}
.keyrow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.keyrow .field{flex:1;min-width:160px}

.credits{max-width:720px;margin:0 auto;padding:4px 16px 28px;text-align:center;font-size:12px;line-height:1.4;color:var(--muted)}

:root[data-edd]{--course:#1B7F3E;--course-text:#14692F;--on-course:#FFFFFF}
@media (prefers-color-scheme:dark){:root[data-edd]:not([data-theme="light"]){--course:#34A85F;--course-text:#7FE0A4;--on-course:#06170D}}
:root[data-theme="dark"][data-edd]{--course:#34A85F;--course-text:#7FE0A4;--on-course:#06170D}
.switch{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;margin:0 0 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:none;width:54px;height:32px;border-radius:999px;background:var(--track);position:relative;transition:background .2s}
.thumb{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.switch input:checked+.track{background:var(--course)}
.switch input:checked+.track .thumb{transform:translateX(22px)}
.switch input:focus-visible+.track{outline:3px solid var(--course);outline-offset:3px}
.switch:has(input:checked){border-color:var(--course)}
.sw-label b{display:block;font-family:var(--font-display);font-size:18px}
.sw-label small{display:block;color:var(--muted);font-size:14px;line-height:1.3}
.refrows{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px}
.refrows .rc{min-height:68px;font-family:var(--font-display);font-size:30px;font-weight:800;color:var(--ink)}
.refrows .rc[aria-pressed=true]{color:var(--on-course);font-size:30px}
.icon-btn{display:inline-grid;place-items:center;width:44px;padding:0}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn svg .k{fill:currentColor;stroke:none}
.team-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opt{font-weight:500;color:var(--muted);font-size:13px}
.distbars{display:grid;gap:10px}
.dbrow{display:grid;grid-template-columns:130px 1fr 100px;align-items:center;gap:10px}
.dblabel{font-weight:600;font-size:14px}
.dbtrack{height:10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.dbfill{display:block;height:100%;background:var(--course);border-radius:999px}
.dbval{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.dbrow{grid-template-columns:1fr;gap:4px}.dbval{text-align:left}}
.sk-table{table-layout:fixed;width:100%;min-width:640px}
.sk-table td.sk-cell{text-align:center;font-size:13px;color:var(--muted);padding:10px 4px}
.sk-table td.sk-cell b{display:block;margin-top:2px;font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink)}
.subtabs{display:inline-flex;gap:4px;padding:4px;margin:0 0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--card)}
.chip.sub{min-height:40px;padding:6px 18px;border:0;background:none}
.chip.sub.on{background:var(--course);color:var(--on-course)}
.ghost.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.top-r .sm{display:none}
.rules{margin:0 0 14px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 10px}
.scell{display:flex;flex-direction:column;align-items:center;gap:4px}
.scell label{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--muted)}
.scell input{width:100%;min-height:60px;padding:0;text-align:center;text-transform:uppercase;font-family:var(--font-display);font-weight:800;font-size:30px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.scell input:not(:placeholder-shown){border-color:var(--course)}
.checks .dup .ic{background:var(--muted)}
.checks .part .ic{background:var(--control)}
.checks .part .pts{color:var(--ink)}
.bilan{padding:6px}
.bt-wrap{border:0;background:none}
.bt{font-size:16px}
.bt th,.bt td{padding:10px 8px;white-space:nowrap;vertical-align:middle}
.bt th{vertical-align:bottom;font-size:13px;line-height:1.25}
.bt th b{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink)}
.bt th small{display:block;font-weight:500}
.bt .c-p{font-weight:600}
.bt .c-l{font-family:var(--font-display);font-weight:800;font-size:22px;text-align:center}
.bt th.c-l{font-size:13px;font-family:var(--font-body);font-weight:600;color:var(--muted)}
.bt .c-o,.bt .c-q{text-align:left}
.bt th.c-o{border-bottom:3px solid var(--lv-mid)}
.bt th.c-q{border-bottom:3px solid var(--course)}
.bt td.c-q,.bt th.c-q{background:color-mix(in srgb,var(--course) 9%,transparent)}
.bt td.c-o,.bt th.c-o{background:color-mix(in srgb,var(--lv-mid) 10%,transparent)}
.bt td.c-x{color:var(--muted);text-align:center;font-style:italic}
.bt tfoot td{border-top:2px solid var(--line);border-bottom:0;font-family:var(--font-display);font-weight:800;font-size:18px}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;vertical-align:middle}
.mk.ok{background:var(--ok)}.mk.bad{background:var(--bad)}
.mk svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.mv{font-family:var(--font-display);font-weight:800;font-size:18px;vertical-align:middle}
.mv.muted{color:var(--muted);font-weight:600}
.stats.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:560px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.checks .pts{min-width:104px;text-align:right;font-size:14px;color:var(--muted);font-weight:600}
.checks .ok .pts{color:var(--ok)}.checks .bad .pts{color:var(--bad)}

/* Modale + toast */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,18,14,.55)}
.sheet{width:100%;max-width:520px;max-height:90%;overflow:auto;padding:20px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:430px){.tile b{font-size:28px}.stat{padding:10px 6px}}
@media (max-width:520px){.top-in{padding:8px 12px}.brand{display:none}.top-r{gap:8px}.ghost{padding:8px 10px;font-size:14px}.logo{height:32px}}
@media (max-width:430px){.top-r .lg{display:none}.top-r .sm{display:inline}}
@media (max-width:380px){.top-r{gap:6px}.ghost{padding:8px 8px;font-size:13px}}
.logo-edd{display:none;height:46px}
:root[data-edd] .logo-cimf{display:none}
:root[data-edd] .logo-edd{display:block}
@media (max-width:520px){.logo-edd{height:38px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" data-act="home" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="3" fill="#fff" stroke="#14231C" stroke-width="2"/><path d="M3 29 L29 3 L29 26 a3 3 0 0 1 -3 3 Z" fill="#FF6A13"/><path d="M3 6 a3 3 0 0 1 3 -3 L29 3 L3 29 Z" fill="#fff"/><rect x="3" y="3" width="26" height="26" rx="3" fill="none" stroke="#14231C" stroke-width="2"/></svg>
    </button>
    <div class="top-r">
      <button class="ghost" data-act="home" id="parcoursBtn">Parcours</button>

"33","p":1},"51":{"b":"5","p":1},"52":{"b":"31","p":1},"53":{"b":"26","p":1},"54":{"b":"38","p":1},"55":{"b":"7","p":2},"56":{"b":"35","p":2},"57":{"b":"1","p":2},"58":{"b":"16","p":1},"59":{"b":"40","p":2},"60":{"b":"6","p":2},"61":{"b":"32","p":1},"62":{"b":"10","p":1},"63":{"b":"11","p":1},"64":{"b":"37","p":1},"65":{"b":"13","p":1},"66":{"b":"30","p":1},"67":{"b":"15","p":1},"68":{"b":"39","p":1},"69":{"b":"21","p":1},"70":{"b":"12","p":2},"71":{"b":"20","p":1},"72":{"b":"28","p":1},"73":{"b":"8","p":1},"74":{"b":"24","p":1},"75":{"b":"18","p":1},"76":{"b":"29","p":2},"77":{"b":"22","p":1},"78":{"b":"19","p":1},"79":{"b":"25","p":1},"80":{"b":"17","p":1}},"edd":{"answers":{"1":"B","2":"C","3":"D","4":"C","5":"C","6":"D","7":"C","8":"A","9":"C","10":"D","11":"A","12":"B","13":"D","14":"A","15":"A","16":"D","17":"A","18":"B","19":"B","20":"C","21":"C","22":"A","23":"C","24":"C","25":"D","26":"B","27":"C","28":"A","29":"D","30":"B","31":"B","32":"C","33":"A","34":"A","35":"D","36":"B","37":"B","38":"D","39":"A","40":"D"},"provisional":false}}</script>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Stockage local (jamais bloquant) ---------- */
const mem={};
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
};

/* ---------- Données : parcours, balises, codes ---------- */
const EMBED=JSON.parse($('#oc-data').textContent);
const COLS='ABCD';
const LVL={facile:'Facile',intermediaire:'Intermédiaire',difficile:'Difficile'};
const LV_ORDER=['facile','intermediaire','difficile'];

function buildData(src,demo,from){
  const balises={};
  Object.keys(src.balises).forEach(k=>{balises[String(k)]=String(src.balises[k]).toUpperCase().split('')});
  const parcours=[];
  src.parcours.map(a=>({n:+a[0],lv:a[1],len:+a[2],b:a[3].map(String)})).sort((x,y)=>x.n-y.n).forEach(q=>{
    parcours.push({key:String(q.n),n:q.n,rev:false,label:String(q.n),lv:q.lv,len:q.len,b:q.b});
    parcours.push({key:q.n+'r',n:q.n,rev:true,label:q.n+'.',lv:q.lv,len:q.len,b:q.b.slice().reverse()});
  });
  return {demo,from,pin:String(EMBED.pin||'1234'),balises,parcours};
}
function loadScore(){
  let c=null;
  try{c=JSON.parse(LS.get('oc:score')||'null')}catch(e){}
  const E=EMBED.score||{};
  const norm=o=>{const r={};Object.keys(o||{}).forEach(k=>{r[String(k)]={b:String(o[k].b),p:+o[k].p||0}});return r};
  if(c&&c.postes)return {postes:norm(c.postes),limitMin:+c.limitMin>0?+c.limitMin:30,penalty:+c.penalty>=0?+c.penalty:5,provisional:false,from:'device'};
  return {postes:norm(EMBED.postes),limitMin:+E.limitMin>0?+E.limitMin:30,penalty:E.penaltyPerMin==null?5:+E.penaltyPerMin,provisional:!!E.provisional,from:'embedded'};
}
function loadEdd(){
  let c=null;
  try{c=JSON.parse(LS.get('oc:edd')||'null')}catch(e){}
  if(c&&c.answers)return {answers:c.answers,provisional:false,from:'device'};
  const E=EMBED.edd||{};
  return {answers:E.answers||{},provisional:!!E.provisional,from:'embedded'};
}
function loadData(){
  let c=null,d=null;
  try{c=JSON.parse(LS.get('oc:custom')||'null')}catch(e){}
  if(c&&c.balises&&c.parcours){try{d=buildData(c,false,'device')}catch(e){}}
  if(!d)d=buildData(EMBED,!!EMBED.demo,'embedded');
  d.score=loadScore();
  d.edd=loadEdd();
  return d;
}
let DATA=loadData();
const P=k=>DATA.parcours.find(p=>p.key===String(k));
const maxId=()=>Object.keys(DATA.score.postes).reduce((m,k)=>Math.max(m,+k),0);
const maxP=()=>DATA.parcours.reduce((m,p)=>Math.max(m,p.n),0);
const keyLabel=k=>String(k).replace(/r$/,'.');

function expectedLetter(p,i,ref){
  const code=DATA.balises[p.b[i]];
  if(!code)return null;
  const col=COLS.indexOf(ref[0]),row=parseInt(ref[1],10)-1;
  return code[row*4+col]||null;
}
function evalRec(r){
  const p=P(r.p);
  if(!p)return {p:null,marks:[],errors:null,secs:r.secs>0?r.secs:null,ppk:null,kmh:null};
  const marks=p.b.map((b,i)=>{const l=r.letters[i];return !!l&&l===expectedLetter(p,i,r.ref)});
  const errors=marks.filter(m=>!m).length;
  const secs=r.secs>0?r.secs:null;
  return {p,marks,errors,secs,ppk:secs?paceSecs(p.len,secs):null,kmh:secs?p.len*3.6/secs:null};
}

/* ---------- Formats ---------- */
const fmtNum=(x,d=1)=>x==null?'—':x.toFixed(d).replace('.',',');
const fmtTime=s=>{
  if(s==null)return '—';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`;
};
// Allure de course à pied : minutes et secondes par kilomètre
const paceSecs=(len,secs)=>Math.round(secs*1000/len);
const fmtPace=s=>s==null?'—':`${Math.floor(Math.round(s)/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;
const plural=(n,w)=>`${n} ${w}${n>1&&!/[sx]$/.test(w)?'s':''}`;
const errCls=n=>n==null?'e2':n===0?'e0':n===1?'e1':'e2';
const cleanName=s=>String(s||'').replace(/[;\r\n\t]+/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

/* ---------- Résultats enregistrés sur cet appareil ---------- */
let records=[];
try{records=JSON.parse(LS.get('oc:records')||'[]').filter(r=>r&&r.id&&(r.p||r.mode==='score')).map(r=>r.p?({...r,p:String(r.p)}):r)}catch(e){}
const saveRecords=()=>LS.set('oc:records',JSON.stringify(records));

/* ---------- État de l'interface ---------- */
const S={
  view:'home',orienteur:cleanName(LS.get('oc:orienteur')||''),suiveur:cleanName(LS.get('oc:suiveur')||''),controleur:cleanName(LS.get('oc:controleur')||''),filter:'all',
  p:null,ref:'',letters:['','','',''],min:'',sec:'',editId:null,recId:null,
  teacherOK:false,tab:'results',statSub:'parcours',keySub:'parcours',skMode:'std',skRef:'A1',sort:{k:'ts',d:-1},kp:null,kref:'A1',msg:null,msgS:null,msgE:null,edd:false,sub:'parcours',visits:[],ssort:{k:'final',d:-1}
};
const main=$('#view');

/* ---------- Petits utilitaires d'interface ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;const f=m.querySelector('textarea,button');if(f)f.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';pending=null}
let pending=null;
function openTextModal(title,hint,text){
  openModal(`<h2>${esc(title)}</h2><p class="help">${esc(hint)}</p><textarea id="mtxt" readonly rows="8">${esc(text)}</textarea><div class="row"><button class="btn primary" data-act="sel-all">Tout sélectionner</button><button class="btn" data-act="modal-close">Fermer</button></div>`);
}
function askConfirm(text,label,fn){
  pending=fn;
  openModal(`<h2>Confirmer</h2><p>${esc(text)}</p><div class="row"><button class="btn danger" data-act="confirm-yes">${esc(label)}</button><button class="btn" data-act="modal-close">Annuler</button></div>`);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(_){return false}
  }
}

/* ---------- Schéma du parcours (cercles reliés, comme sur une carte) ---------- */
function courseSvg(p,marks,anim){
  const pts=[[44,128],[170,56],[296,128],[422,56],[548,128]],R=30;
  let s=`<svg class="course${anim?' anim':''}" viewBox="0 0 600 190" role="img" aria-label="Parcours ${p.label}${p.rev?' (sens inverse)':''}, balises ${p.b.join(', ')}">`;
  for(let i=0;i<4;i++){
    const a=pts[i],b=pts[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),ux=(b[0]-a[0])/d,uy=(b[1]-a[1])/d;
    const s0=i===0?20:R+4,s1=R+4;
    s+=`<line class="path" x1="${(a[0]+ux*s0).toFixed(1)}" y1="${(a[1]+uy*s0).toFixed(1)}" x2="${(b[0]-ux*s1).toFixed(1)}" y2="${(b[1]-uy*s1).toFixed(1)}"/>`;
  }
  const [sx,sy]=pts[0];
  s+=`<polygon class="tri" points="${sx},${sy-17} ${sx-15},${sy+11} ${sx+15},${sy+11}"/>`;
  p.b.forEach((b,i)=>{
    const [cx,cy]=pts[i+1],st=marks?(marks[i]?'ok':'bad'):'';
    s+=`<g class="node" style="--i:${i}"><circle class="ring ${st}" cx="${cx}" cy="${cy}" r="${R}"/><text x="${cx}" y="${cy}" dy=".35em">${esc(b)}</text>`;
    if(marks){
      const bx=cx+25,by=cy-25;
      s+=`<circle class="bdg ${st}" cx="${bx}" cy="${by}" r="13"/>`;
      s+=marks[i]?`<path class="sym" d="M${bx-5} ${by} l4 4 l7 -8"/>`:`<path class="sym" d="M${bx-5} ${by-5} l10 10 M${bx+5} ${by-5} l-10 10"/>`;
    }
    s+='</g>';
  });
  return s+'</svg>';
}
const ICON_OK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 l3.5 3.5 l6.5 -8"/></svg>';
const ICON_BAD='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5 l9 9 M12.5 3.5 l-9 9"/></svg>';

/* ---------- Vues élèves ---------- */
function tile(p){
  return `<button class="tile lv-${p.lv}${p.rev?' rev':''}" data-act="open" data-p="${p.key}" aria-label="Parcours ${p.n}${p.rev?' dans le sens inverse':''}, ${LVL[p.lv]}, ${p.len} mètres"><b>${p.label}</b><span>${p.len} m</span></button>`;
}
const teamLine=r=>`${r.orienteur}${r.suiveur?' / '+r.suiveur:''}`;
function teamFields(){
  return `<label class="field"><span>Contrôleur <span class="opt">(facultatif)</span></span><input type="text" id="controleur" data-in="controleur" placeholder="" autocomplete="off" maxlength="30" value="${esc(S.controleur)}"></label>
  <div class="team-row"><label class="field"><span>Orienteur</span><input type="text" id="orienteur" data-in="orienteur" placeholder="Léa" autocomplete="off" maxlength="30" value="${esc(S.orienteur)}"></label><label class="field"><span>Suiveur</span><input type="text" id="suiveur" data-in="suiveur" placeholder="Tom" autocomplete="off" maxlength="30" value="${esc(S.suiveur)}"></label></div>`;
}
function viewHome(){
  const chips=[['all','Tous'],...LV_ORDER.map(l=>[l,LVL[l]])].map(([k,t])=>`<button class="chip${S.filter===k?' on':''}" data-act="filter" data-f="${k}" aria-pressed="${S.filter===k}">${t}</button>`).join('');
  const sections=LV_ORDER.filter(l=>S.filter==='all'||S.filter===l).map(l=>{
    const ps=DATA.parcours.filter(p=>p.lv===l);
    if(!ps.length)return '';
    return `<section class="lvl lv-${l}"><h2><i class="dot"></i>${LVL[l]} <small>${plural(ps.filter(x=>!x.rev).length,'parcours')}, dans les deux sens</small></h2><div class="grid">${ps.map(tile).join('')}</div></section>`;
  }).join('');
  const mine=records.filter(r=>r.src==='local'&&r.mode!=='score').slice(-5).reverse();
  const hist=mine.length?`<section class="hist"><h2>Dernières courses enregistrées</h2><ul>${mine.map(r=>{
    const e=evalRec(r);
    return `<li><button data-act="showrec" data-id="${esc(r.id)}"><b>${esc(teamLine(r))}</b><span>Parcours ${keyLabel(r.p)}</span><span class="err ${errCls(e.errors)}">${e.errors==null?'?':plural(e.errors,'erreur')}</span><span>${fmtTime(e.secs)}</span></button></li>`;
  }).join('')}</ul></section>`:'';
  return `<section class="hero"><h1>Vérifie ton parcours</h1><p>Entre les lettres relevées et ton temps : tu vois tout de suite tes erreurs et ton allure.</p></section>
  ${DATA.demo?'<p class="notice">Mode démonstration : les parcours affichés sont des exemples.</p>':''}
  <div class="who">
    ${teamFields()}
      </div>
  <div class="chips" role="group" aria-label="Filtrer par niveau">${chips}</div>
  <p class="help">Un numéro suivi d'un point, comme 5., est le même parcours fait à l'envers : mêmes balises, dans l'ordre inverse.</p>
  ${sections}${hist}`;
}

function refRows(){
  return [1,2,3,4].map(n=>`<button class="rc" data-act="ref" data-ref="${n}" aria-pressed="false" aria-label="Ligne ${n}">${n}</button>`).join('');
}
function refCells(){
  let cells='<span></span>'+COLS.split('').map(c=>`<span class="ax">${c}</span>`).join('');
  for(let r=1;r<=4;r++){
    cells+=`<span class="ax">${r}</span>`;
    COLS.split('').forEach(c=>{cells+=`<button class="rc" data-act="ref" data-ref="${c}${r}" aria-pressed="false" aria-label="Colonne ${c}, ligne ${r}">${c}${r}</button>`});
  }
  return cells;
}
function viewRun(){
  const p=P(S.p);
  if(!p){S.view='home';return viewHome()}
  const cells=refCells();
  const rows=p.b.map((b,i)=>`<div class="lcell"><label for="L${i}">Balise<br>n°${esc(b)}</label><input id="L${i}" class="letter" data-in="letter" data-i="${i}" maxlength="2" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Lettre relevée à la balise ${esc(b)}" value="${esc(S.letters[i])}"></div>`).join('');
  return `<button class="back" data-act="home">‹ Changer de parcours</button>
  <section class="card course-card lv-${p.lv}">
    <div class="cc-head"><h1>Parcours ${p.label}</h1><span class="badge"><i class="dot"></i>${LVL[p.lv]}</span>${p.rev?'<span class="badge">↺ Sens inverse</span>':''}<span class="len">${p.len} m</span></div>
    ${courseSvg(p,null,false)}
  </section>
  <section class="card step"><h2><span class="n">1</span>Les lettres relevées</h2><p>Une lettre par balise, dans l'ordre de ton parcours.</p><div class="lrow">${rows}</div></section>
  <section class="card step"><h2><span class="n">2</span>Ton code réponse</h2><p>Touche la case indiquée sur ta fiche de départ.</p>
    <div class="refgrid">${cells}</div><p class="ref-out" id="refOut" aria-live="polite"></p></section>
  <section class="card step"><h2><span class="n">3</span>Ton temps</h2><p>Le temps total de ta course.</p>
    <div class="time"><label><span>Minutes</span><input type="text" id="tMin" data-in="min" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="0" autocomplete="off" value="${esc(S.min)}"></label><span class="colon">:</span><label><span>Secondes</span><input type="text" id="tSec" data-in="sec" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="00" autocomplete="off" value="${esc(S.sec)}"></label></div>
    <p class="pace" id="pace" aria-live="polite"></p></section>
  <div class="bar"><button class="btn primary block" data-act="verify">Vérifier mon parcours</button></div>`;
}
function paintRef(){
  document.querySelectorAll('.rc').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ref===S.ref)));
  const o=$('#refOut');
  if(!o)return;
  if(!S.ref)o.innerHTML='';
  else if(S.ref.length===1)o.innerHTML=`Ton code réponse : <b>${S.ref}</b>. Sur chaque balise, relève la lettre de la colonne de ta réponse (A, B, C ou D), sur la ligne ${S.ref}.`;
  else o.innerHTML=`Ton code réponse : <b>${S.ref}</b>. À chaque balise, lis la lettre de la colonne ${S.ref[0]}, ligne ${S.ref[1]}.`;
}
function curSecs(){
  if(S.min===''&&S.sec==='')return null;
  const t=(parseInt(S.min,10)||0)*60+(parseInt(S.sec,10)||0);
  return t>0?t:null;
}
function updatePace(){
  const el=$('#pace'),p=P(S.p),t=curSecs();
  if(!el||!p)return;
  el.textContent=t?`Allure : ${fmtPace(paceSecs(p.len,t))} min/km, soit ${fmtNum(p.len*3.6/t)} km/h`:'';
}

function viewResult(){
  const r=records.find(x=>x.id===S.recId);
  if(!r){S.view='home';return viewHome()}
  const e=evalRec(r),p=e.p;
  if(!p)return `<button class="back" data-act="home">‹ Accueil</button><p class="notice">Le parcours ${keyLabel(r.p)} n'existe pas dans les données actuelles.</p>`;
  const perfect=e.errors===0;
  const title=perfect?'Aucune erreur, bravo !':`${plural(e.errors,'erreur')} sur 4 balises`;
  const sub=perfect?`Parcours ${p.label} validé pour ${esc(teamLine(r))}.`:'Vérifie les lettres des balises marquées d\'une croix.';
  const list=p.b.map((b,i)=>`<li class="${e.marks[i]?'ok':'bad'}"><span class="ic">${e.marks[i]?ICON_OK:ICON_BAD}</span><span>Balise n°${esc(b)}</span><span class="lt">${r.letters[i]?esc(r.letters[i]):'—'}</span></li>`).join('');
  const stats=e.secs?`<div class="stats"><div class="stat"><b>${fmtTime(e.secs)}</b><span>temps</span></div><div class="stat"><b>${fmtPace(e.ppk)}</b><span>allure (min / km)</span></div><div class="stat"><b>${fmtNum(e.kmh)}</b><span>vitesse (km / h)</span></div></div>`
    :`<p class="notice">Tu n'as pas indiqué ton temps. Ajoute-le pour connaître ton allure.</p>`;
  return `<div class="res-head ${perfect?'perfect':'wrong'} lv-${p.lv}"><h1>${title}</h1><p>${sub}</p></div>
  <section class="card course-card">${courseSvg(p,e.marks,true)}</section>

const posteOf=id=>DATA.score.postes[String(id)]||null;
function scoreExpected(id,ref){
  const code=DATA.balises[String(id)];
  if(!code)return null;
  const col=COLS.indexOf(ref[0]),row=parseInt(ref[1],10)-1;
  return code[row*4+col]||null;
}
function eddExpected(bal,ref){
  const a=DATA.edd.answers[String(bal)],code=DATA.balises[String(bal)];
  if(!a||!code)return null;
  const col=COLS.indexOf(String(a).toUpperCase()),row=parseInt(ref,10)-1;
  return col<0||!(row>=0&&row<4)?null:(code[row*4+col]||null);
}
const EDD_BONUS=1;
function eddRowLetters(bal,ref){
  const code=DATA.balises[String(bal)],row=parseInt(ref,10)-1;
  return code&&row>=0&&row<4?[0,1,2,3].map(c=>code[row*4+c]):[];
}
function evalScore(r){
  const done=new Set();
  let orient=0,bonus=0,valid=0,wrong=0,dups=0,qOk=0,qWrong=0;
  const rows=r.visits.map(v=>{
    const id=v.b===''||v.b==null?'':String(parseInt(v.b,10));
    const l=String(v.l||'').toUpperCase();
    const po=id?posteOf(id):null;
    if(!po||!DATA.balises[po.b]){wrong++;return {id:id||'?',l,st:'none',pts:0,q:0}}
    if(done.has(id)){dups++;return {id,l,st:'dup',pts:0,q:0}}
    if(r.edd){
      /* Orientation : la lettre relevée doit figurer sur la ligne du code réponse de la balise (quelle que soit la colonne).
         Question : la lettre doit être celle de la colonne de la bonne réponse. */
      if(l&&eddRowLetters(po.b,r.ref).includes(l)){
        done.add(id);orient+=po.p;valid++;
        const good=l===eddExpected(po.b,r.ref);
        if(good){qOk++;bonus+=EDD_BONUS}else qWrong++;
        return {id,l,st:good?'ok':'part',pts:po.p,q:good?EDD_BONUS:0};
      }
      wrong++;return {id,l,st:'bad',pts:0,q:0};
    }
    if(l&&l===scoreExpected(po.b,r.ref)){done.add(id);orient+=po.p;valid++;return {id,l,st:'ok',pts:po.p,q:0}}
    wrong++;return {id,l,st:'bad',pts:0,q:0};
  });
  const raw=orient+bonus;
  const limit=DATA.score.limitMin*60,secs=r.secs>0?r.secs:null;
  const late=secs&&secs>limit?Math.ceil((secs-limit)/60):0;
  const penalty=late*DATA.score.penalty;
  return {rows,orient,bonus,raw,valid,wrong,dups,qOk,qWrong,secs,late,penalty,final:Math.max(0,raw-penalty)};
}

const round1=n=>Math.round(n*10)/10;
function minMaxAvg(vals){
  if(!vals.length)return null;
  return {min:Math.min(...vals),max:Math.max(...vals),avg:vals.reduce((s,v)=>s+v,0)/vals.length};
}
function statsParcours(){
  const rows=records.filter(r=>r.mode!=='score').map(r=>({r,e:evalRec(r)})).filter(x=>x.e.p);
  const byLv={facile:[],intermediaire:[],difficile:[]};
  rows.forEach(x=>{if(byLv[x.e.p.lv])byLv[x.e.p.lv].push(x)});
  const total=rows.length;
  const lvCounts=LV_ORDER.map(lv=>({lv,n:byLv[lv].length,pct:total?byLv[lv].length/total*100:0}));
  const pace=arr=>minMaxAvg(arr.map(x=>x.e.ppk).filter(v=>v!=null));
  const paceGlobal=pace(rows);
  const paceByLv=LV_ORDER.map(lv=>({lv,stats:pace(byLv[lv])}));
  const maxErr=rows.length?Math.max(4,...rows.map(x=>x.e.errors==null?0:x.e.errors)):4;
  const errLevels=Array.from({length:maxErr+1},(_,i)=>i);
  const errRow=arr=>errLevels.map(n=>arr.filter(x=>x.e.errors===n).length);
  const errByLv=LV_ORDER.map(lv=>({lv,counts:errRow(byLv[lv])}));
  const errTotal=errRow(rows);
  return {total,lvCounts,paceGlobal,paceByLv,errLevels,errByLv,errTotal};
}
function statsScore(){
  const rows=records.filter(r=>r.mode==='score').map(r=>({r,e:evalScore(r)}));
  const total=rows.length;
  const MODES=[['std','Standard'],['edd','EDD']];
  const byMode={std:rows.filter(x=>!x.r.edd),edd:rows.filter(x=>x.r.edd)};
  const modeCounts=MODES.map(([k,label])=>({key:k,label,n:byMode[k].length,pct:total?byMode[k].length/total*100:0}));
  const score=arr=>minMaxAvg(arr.map(x=>x.e.final));
  const scoreGlobal=score(rows);
  const scoreByMode=MODES.map(([k,label])=>({key:k,label,stats:score(byMode[k])}));
  const maxErr=rows.length?Math.max(0,...rows.map(x=>x.e.wrong)):0;
  const errLevels=Array.from({length:maxErr+1},(_,i)=>i);
  const errRow=arr=>errLevels.map(n=>arr.filter(x=>x.e.wrong===n).length);
  const errByMode=MODES.map(([k,label])=>({key:k,label,counts:errRow(byMode[k])}));
  const errTotal=errRow(rows);
  return {total,modeCounts,scoreGlobal,scoreByMode,errLevels,errByMode,errTotal};
}

function errTable(levels,total,byGroup){
  const cell=(n,sum)=>`<td class="num">${n}${sum?` (${round1(n/sum*100)}%)`:''}</td>`;
  const head=`<tr><th></th>${levels.map(n=>`<th class="num">${n} err.</th>`).join('')}</tr>`;

  const md=distCard('Répartition Standard / EDD',distBars(s.modeCounts.map(x=>({label:x.label,n:x.n,pct:x.pct}))));

function bestTimes(){

  const done=records.filter(r=>r.mode!=='score').map(r=>({r,e:evalRec(r)})).filter(x=>x.e.p&&x.e.errors===0&&x.e.secs!=null);

  txt.split(/\r?\n/).forEach((line,i)=>{
    line=line.trim();if(!line)return;
    const c=line.split(/[;\t,\s]+/).filter(Boolean);
    if(!/^\d+$/.test(c[0]||'')){if(i>0)errs.push(`EDD, ligne ${i+1} : numéro de balise illisible.`);return}
    const id=String(+c[0]),l=String(c[1]||'').toUpperCase();
    if(!DATA.balises[id]){errs.push(`EDD, ligne ${i+1} : la balise ${id} n'existe pas.`);return}
    if(!/^[A-D]$/.test(l)){errs.push(`EDD, ligne ${i+1} : la réponse doit être A, B, C ou D.`);return}
    if(out[id]){errs.push(`EDD, ligne ${i+1} : la balise ${id} est déjà renseignée.`);return}
    out[id]=l;
  });
  Object.keys(DATA.balises).forEach(id=>{if(!out[id])errs.push(`EDD : la balise ${id} n'a pas de réponse.`)});
  return {out,errs};
}
function tData(){return tDataMain()+tDataScore()+tDataEdd()}
function parsePostes(txt){
  const out={},errs=[];
  txt.split(/\r?\n/).forEach((line,i)=>{
    line=line.trim();if(!line)return;
    const c=line.split(/[;\t,\s]+/).filter(Boolean);
    if(!/^\d+$/.test(c[0]||'')){if(i>0)errs.push(`Postes, ligne ${i+1} : numéro de poste illisible.`);return}
    const id=String(+c[0]),b=String(parseInt(c[1],10)),p=parseInt(c[2],10);
    if(!DATA.balises[b]){errs.push(`Postes, ligne ${i+1} : la balise ${c[1]||'?'} n'existe pas.`);return}
    if(isNaN(p)||p<0||p>1000){errs.push(`Postes, ligne ${i+1} : nombre de points illisible.`);return}
    if(out[id]){errs.push(`Postes, ligne ${i+1} : le poste ${id} est déjà utilisé.`);return}
    out[id]={b,p};
  });
  if(!Object.keys(out).length)errs.push('Aucun poste valide.');
  return {out,errs};
}
function parseBalises(txt){
  const out={},errs=[];
  txt.split(/\r?\n/).forEach((line,i)=>{
    line=line.trim();if(!line)return;
    const parts=line.split(/[;\t,\s]+/).filter(Boolean),id=parts.shift();
    if(!/^\d+$/.test(id)){if(i>0)errs.push(`Balises, ligne ${i+1} : numéro de balise illisible.`);return}
    const l=parts.join('').toUpperCase().replace(/[^A-Z]/g,'');
    if(l.length!==16){errs.push(`Balises, ligne ${i+1} : ${l.length} lettres trouvées, il en faut 16.`);return}
    out[String(+id)]=l;
  });
  return {out,errs};
}
function normLevel(s){
  s=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  return /^f/.test(s)?'facile':/^(i|m)/.test(s)?'intermediaire':/^d/.test(s)?'difficile':null;
}
function parseParcours(txt,bal){
  const out=[],errs=[];
  txt.split(/\r?\n/).forEach((line,i)=>{
    line=line.trim();if(!line)return;
    const c=line.split(/[;\t,]+/).map(x=>x.trim());
    if(!/^\d+$/.test(c[0])){if(i>0)errs.push(`Parcours, ligne ${i+1} : numéro illisible.`);return}
    const lv=normLevel(c[1]),len=parseInt(String(c[2]||'').replace(/\D/g,''),10),b=c.slice(3,7).map(x=>String(parseInt(x,10)));
    if(!lv){errs.push(`Parcours, ligne ${i+1} : niveau non reconnu.`);return}
    if(!len||len<50||len>20000){errs.push(`Parcours, ligne ${i+1} : longueur illisible.`);return}
    if(b.length!==4||b.some(x=>!bal[x])){errs.push(`Parcours, ligne ${i+1} : il faut 4 balises existantes.`);return}
    if(out.some(o=>o[0]===+c[0])){errs.push(`Parcours, ligne ${i+1} : le numéro ${+c[0]} est déjà utilisé.`);return}
    out.push([+c[0],lv,len,b]);
  });
  return {out,errs};
}

/* ---------- Exports ---------- */
function tableRows(){
  return sortedRows().map(({r,e})=>[
    r.orienteur,r.suiveur,r.controleur||'',keyLabel(r.p),e.p?(e.p.rev?'Retour':'Aller'):'',e.p?LVL[e.p.lv]:'',e.p?e.p.len:'',r.ref,r.letters.map(l=>l||'-').join(''),
    e.errors==null?'':e.errors,e.secs?fmtTime(e.secs):'',e.ppk==null?'':fmtPace(e.ppk),e.kmh==null?'':fmtNum(e.kmh),
    new Date(r.ts).toLocaleString('fr-FR')
  ]);
}
const HEAD=['Orienteur','Suiveur','Contrôleur','Parcours','Sens','Niveau','Longueur (m)','Référence','Lettres relevées','Erreurs','Temps','Allure (min/km)','Vitesse (km/h)','Date'];
const SHEAD=['Orienteur','Suiveur','Contrôleur','Mode','Code réponse','Postes validés','Numéros des postes validés','Erreurs','Doublons','Points balises','Points questions EDD','Bonnes réponses EDD','Points gagnés','Temps','Dépassement (min)','Pénalité','Score final','Date'];
function scoreTableRows(){
  return scoreRows().map(({r,e})=>[
    r.orienteur,r.suiveur,r.controleur||'',r.edd?'EDD':'Standard',r.ref,e.valid,e.rows.filter(x=>x.st==='ok'||x.st==='part').map(x=>x.id).join(' '),e.wrong,e.dups,e.orient,r.edd?e.bonus:'',r.edd?e.qOk:'',e.raw,
    e.secs?fmtTime(e.secs):'',e.late,e.penalty,e.final,new Date(r.ts).toLocaleString('fr-FR')
  ]);
}
function exportSet(kind){
  return kind==='score'?{head:SHEAD,rows:scoreTableRows(),file:'resultats-course-au-score'}:{head:HEAD,rows:tableRows(),file:'resultats-orientation'};
}
function buildCsv(head,rows){
  const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '\uFEFF'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
}
async function exportCsv(kind){
  const s=exportSet(kind);
  if(!s.rows.length){toast('Aucun résultat à exporter.');return}
  const csv=buildCsv(s.head,s.rows);
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename:`${s.file}-${today()}.csv`,data:csv});toast('Fichier enregistré');return}
    catch(err){if(err&&err.code==='declined')return}
  }
  openTextModal('Exporter en CSV','Copie ce texte dans un fichier .csv, ou colle-le directement dans un tableur.',csv);
}
async function copyTsv(kind){
  const s=exportSet(kind);
  if(!s.rows.length){toast('Aucun résultat à copier.');return}
  const tsv=[s.head,...s.rows].map(r=>r.map(v=>String(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
  if(await copyText(tsv))toast('Copié : colle dans ton tableur');
  else openTextModal('Copier pour un tableur','Sélectionne tout le texte, copie-le, puis colle-le dans ton tableur.',tsv);
}

/* ---------- Rendu et navigation ---------- */
function render(){
  const v=S.view;
  main.classList.toggle('wide',v==='teacher');
  $('.top-in').classList.toggle('wide-h',v==='teacher');
  main.innerHTML=v==='home'?viewHome():v==='run'?viewRun():v==='result'?viewResult():v==='score'?viewScore():v==='scoreresult'?viewScoreResult():v==='scorekey'?viewScoreKey():viewTeacher();
  const eddOn=v==='score'?S.edd:v==='scoreresult'?!!(records.find(x=>x.id===S.recId)||{}).edd:false;
  document.documentElement.toggleAttribute('data-edd',eddOn);
  $('#parcoursBtn').classList.toggle('on',v==='home'||v==='run'||v==='result');
  $('#scoreBtn').classList.toggle('on',v==='score'||v==='scoreresult'||v==='scorekey');
  $('#teacherBtn').classList.toggle('on',v==='teacher');
  if(S.view==='run'){paintRef();updatePace()}
  if(S.view==='score'){paintRef();updateScoreNote()}
}
function go(v){
  S.view=v;S.msg=null;S.msgS=null;S.msgE=null;render();
  window.scrollTo(0,0);
  const h=$('h1',main);
  if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}
}
function openParcours(n){
  n=String(n);
  if(!S.orienteur.trim()||!S.suiveur.trim()){
    toast('Renseigne l\'Orienteur et le Suiveur avant de commencer.');
    const i=$(!S.orienteur.trim()?'#orienteur':'#suiveur');if(i)i.focus();
    return;
  }
  if(!P(n)){toast('Ce parcours n\'existe pas.');return}
  Object.assign(S,{p:n,ref:'',letters:['','','',''],min:'',sec:'',editId:null});
  go('run');
}
function verify(){
  const p=P(S.p);if(!p)return;
  if(!S.ref){toast('Choisis ton code réponse à l\'étape 2.');const g=$('.refgrid');if(g)g.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(S.letters.every(l=>!l)){toast('Entre au moins une lettre.');const i=$('#L0');if(i)i.focus();return}
  const secs=curSecs(),letters=S.letters.slice();
  let rec=S.editId&&records.find(r=>r.id===S.editId);
  if(rec){Object.assign(rec,{ref:S.ref,letters,secs,tries:rec.tries+1,ts:Date.now()})}
  else{rec={id:uid(),orienteur:cleanName(S.orienteur),suiveur:cleanName(S.suiveur),controleur:cleanName(S.controleur),p:p.key,ref:S.ref,letters,secs,tries:1,ts:Date.now(),src:'local'};records.push(rec)}
  saveRecords();S.recId=rec.id;S.editId=null;
  go('result');
}

/* ---------- Événements ---------- */
document.addEventListener('click',async ev=>{
  const modal=$('#modal');
  if(ev.target===modal){closeModal();return}
  const el=ev.target.closest('[data-act]');
  if(!el)return;
  const d=el.dataset;
  switch(d.act){
    case 'home':go('home');break;
    case 'scorekey':go('scorekey');break;
    case 'backscore':go('score');break;
    case 'score':if(S.view!=='score'){resetScore();go('score')}break;
    case 'snew':S.orienteur='';S.suiveur='';S.controleur='';LS.set('oc:orienteur','');LS.set('oc:suiveur','');LS.set('oc:controleur','');resetScore();go('score');break;
    case 'sedit':{
      const r=records.find(x=>x.id===d.id&&x.mode==='score');if(!r)break;
      const m=Math.floor(r.secs/60),s=r.secs%60;
      Object.assign(S,{ref:r.ref,edd:!!r.edd,visits:withLetters(r.visits),min:String(m),sec:String(s).padStart(2,'0'),editId:r.id,orienteur:r.orienteur,suiveur:r.suiveur,controleur:r.controleur||''});
      go('score');break;
    }
    case 'showscore':S.recId=d.id;go('scoreresult');break;
    case 'sverify':verifyScore();break;
    case 'ssort':S.ssort=S.ssort.k===d.k?{k:d.k,d:-S.ssort.d}:{k:d.k,d:1};render();break;
    case 'clear-score':askConfirm('Tous les résultats de la course au score enregistrés sur cet appareil seront supprimés. Pense à exporter avant.','Tout effacer',()=>{records=records.filter(r=>r.mode!=='score');saveRecords();render()});break;
    case 'save-score':{
      const pp=parsePostes(($('#dPts')||{}).value||''),errs=[...pp.errs];
      const lim=parseInt(($('#sLimit')||{}).value,10),pen=parseInt(($('#sPen')||{}).value,10);
      if(!(lim>0))errs.push('Durée limite : nombre de minutes illisible.');
      if(isNaN(pen)||pen<0)errs.push('Pénalité : nombre illisible.');
      if(errs.length){S.msgS={k:'bad',t:errs.slice(0,8).join('\n')+(errs.length>8?`\n… et ${errs.length-8} autre(s)`:'')};render();break}
      LS.set('oc:score',JSON.stringify({postes:pp.out,limitMin:lim,penalty:pen}));
      DATA=loadData();S.msgS={k:'good',t:`Enregistré : ${plural(Object.keys(pp.out).length,'poste')}, limite ${lim} min, pénalité ${pen} par minute entamée.`};render();break;
    }
    case 'save-edd':{
      const r=parseEdd(($('#dEdd')||{}).value||'');
      if(r.errs.length){S.msgE={k:'bad',t:r.errs.slice(0,8).join('\n')+(r.errs.length>8?`\n… et ${r.errs.length-8} autre(s)`:'')};render();break}
      LS.set('oc:edd',JSON.stringify({answers:r.out}));DATA=loadData();
      S.msgE={k:'good',t:`Enregistré : ${plural(Object.keys(r.out).length,'balise')} avec leur bonne réponse.`};render();break;
    }
    case 'reset-edd':LS.del('oc:edd');DATA=loadData();S.msgE={k:'good',t:'Valeurs intégrées rétablies.'};render();break;
    case 'reset-score':LS.del('oc:score');DATA=loadData();S.msgS={k:'good',t:'Valeurs intégrées rétablies.'};render();break;
    case 'newrun':S.orienteur='';S.suiveur='';LS.set('oc:orienteur','');LS.set('oc:suiveur','');go('home');break;
    case 'teacher':S.view='teacher';go('teacher');break;
    case 'filter':S.filter=d.f;render();break;
    case 'open':openParcours(d.p);break;
    case 'ref':S.ref=d.ref;paintRef();break;
    case 'verify':verify();break;
    case 'showrec':S.recId=d.id;go('result');break;
    case 'edit':{
      const r=records.find(x=>x.id===d.id);if(!r)break;
      const m=r.secs?Math.floor(r.secs/60):'',s=r.secs?r.secs%60:'';
      Object.assign(S,{p:String(r.p),ref:r.ref,letters:r.letters.slice(),min:m===''?'':String(m),sec:s===''?'':String(s).padStart(2,'0'),editId:r.id,orienteur:r.orienteur,suiveur:r.suiveur,controleur:r.controleur||''});
      go('run');break;
    }
    case 'pin-ok':tryPin();break;
    case 'lock':S.teacherOK=false;render();break;
    case 'subtab':S.sub=d.s;render();break;
    case 'statsubtab':S.statSub=d.s;render();break;
    case 'export-stats':exportStatsCsv(d.kind);break;
    case 'copy-stats':copyStatsTsv(d.kind);break;
    case 'export-records':exportRecordsCsv();break;
    case 'copy-records':copyRecordsTsv();break;
    case 'tab':S.tab=d.t;S.msg=null;S.msgS=null;S.msgE=null;render();break;
    case 'sort':S.sort=S.sort.k===d.k?{k:d.k,d:-S.sort.d}:{k:d.k,d:1};render();break;
    case 'export-csv':exportCsv(d.kind);break;
    case 'copy-tsv':copyTsv(d.kind);break;
    case 'delrec':records=records.filter(r=>r.id!==d.id);saveRecords();render();break;
    case 'clear-all':askConfirm('Tous les résultats des parcours enregistrés sur cet appareil seront supprimés. Pense à exporter avant.','Tout effacer',()=>{records=records.filter(r=>r.mode==='score');saveRecords();render()});break;
    case 'save-data':{
      const b=parseBalises(($('#dBal')||{}).value||''),errs=[...b.errs];
      const pr=parseParcours(($('#dPar')||{}).value||'',b.out);errs.push(...pr.errs);
      if(!Object.keys(b.out).length)errs.push('Aucune balise valide.');
      if(!pr.out.length)errs.push('Aucun parcours valide.');
      if(errs.length){S.msg={k:'bad',t:errs.slice(0,8).join('\n')+(errs.length>8?`\n… et ${errs.length-8} autre(s)`:'')};render();break}
      LS.set('oc:custom',JSON.stringify({balises:b.out,parcours:pr.out}));
      DATA=loadData();S.msg={k:'good',t:`Enregistré : ${plural(Object.keys(b.out).length,'balise')} et ${plural(pr.out.length,'parcours')}.`};render();break;
    }
    case 'reset-data':LS.del('oc:custom');DATA=loadData();S.msg={k:'good',t:'Données intégrées rétablies.'};render();break;
    case 'sel-all':{const t=$('#mtxt');if(t){t.focus();t.select()}break}
    case 'modal-close':closeModal();break;
    case 'confirm-yes':{const f=pending;closeModal();if(f)f();break}
  }
});
function tryPin(){
  const v=(($('#pin')||{}).value||'').trim();
  if(v===DATA.pin){S.teacherOK=true;S.tab='results';render()}
  else{const e=$('#pinErr');if(e)e.textContent='Code incorrect.';const i=$('#pin');if(i){i.value='';i.focus()}}
}
document.addEventListener('input',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in;
  if(!k)return;
  if(k==='orienteur'){S.orienteur=t.value;LS.set('oc:orienteur',cleanName(t.value))}
  else if(k==='suiveur'){S.suiveur=t.value;LS.set('oc:suiveur',cleanName(t.value))}
  else if(k==='controleur'){S.controleur=t.value;LS.set('oc:controleur',cleanName(t.value))}
  else if(k==='letter'){
    const i=+t.dataset.i,v=t.value.toUpperCase().replace(/[^A-Z]/g,'').slice(-1);
    t.value=v;S.letters[i]=v;
    if(v){if(i<3){const nx=$('#L'+(i+1));if(nx)nx.focus()}else t.blur()}
  }
  else if(k==='min'){
    t.value=t.value.replace(/\D/g,'');S.min=t.value;updatePace();updateScoreNote();
    const need=S.view==='score'?2:1;
    if(t.value.length>=need){const nx=$('#tSec');if(nx)nx.focus()}
  }
  else if(k==='sec'){t.value=t.value.replace(/\D/g,'');S.sec=t.value;updatePace();updateScoreNote()}
  else if(k==='sl'){
    const i=+t.dataset.i,v=t.value.toUpperCase().replace(/[^A-Z]/g,'').slice(-1);
    t.value=v;S.visits[i].l=v;
    if(v){const nx=$('#sl'+(i+1));if(nx)nx.focus();else t.blur()}
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in;
  if(k==='edd'){S.edd=t.checked;S.ref='';render();const s=$('#eddSwitch');if(s)s.focus()}
  else if(k==='kp'){S.kp=t.value;render()}
  else if(k==='kref'){S.kref=t.value;render()}
  else if(k==='skMode'){S.skMode=t.value;S.skRef=t.value==='edd'?'1':'A1';render()}
  else if(k==='skRef'){S.skRef=t.value;render()}
});
document.addEventListener('focusin',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.in==='letter'&&t.select)setTimeout(()=>t.select(),0);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  if(ev.key!=='Enter')return;
  const t=ev.target;
  if(t.dataset&&t.dataset.in==='pin'){ev.preventDefault();tryPin()}
  else if(t.id==='tSec'||t.id==='tMin'){ev.preventDefault();if(S.view==='score')verifyScore();else verify()}
});

render();
})();
</script>
